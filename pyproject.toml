[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "luban-dynamic-llm"
version = "0.0.1"
description = "Paper-gated research on a bounded, evolving neural language model"
requires-python = ">=3.11"
dependencies = ["torch>=2.8,<2.9", "transformers>=5.13,<5.14", "safetensors>=0.6,<1", "pillow>=12,<13", "soundfile>=0.14,<1", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.28,<1", "psutil>=6,<8"]

[project.scripts]
luban-app = "luban.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
luban = ["web/*", "name_words.json", "name_words.LICENSE"]
